[project]
name = "transition-studio"
version = "0.1.0"
description = "Transition Studio — internal prototype of an AI-guided direct-indexing / model-transition platform (synthetic data only)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "cvxpy>=1.5",
    "clarabel>=0.9",
    "osqp>=0.6",
    "pdfplumber>=0.11",
    "reportlab>=4.2",
    "plaid-python>=23.0",
    "anthropic>=0.40",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
    "email-validator>=2.3.0",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend", "reference"]  # the front end has its own ruff config

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]  # Depends() defaults; intentional unicode (×, →, ±)

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["app.domain.*", "app.analytics.*", "app.optimizer.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# Intel-mac friendly: only resolve to versions that ship prebuilt wheels.
no-build-package = ["cryptography", "scs", "osqp", "clarabel", "numpy", "scipy", "pandas"]
# Pins below are the latest releases with macOS x86_64 wheels.
constraint-dependencies = ["scs<=3.2.8", "cryptography<=48.0.1"]

[tool.ruff.lint.per-file-ignores]
# V (account value) and other single-letter math names follow docs/optimizer.md notation
"app/optimizer/*" = ["N806"]
"app/services/transitions.py" = ["N806"]

[[tool.mypy.overrides]]
# cvxpy ships partial type hints that mypy --strict cannot use; treat it as untyped
module = ["cvxpy", "cvxpy.*"]
follow_imports = "skip"
follow_untyped_imports = true
